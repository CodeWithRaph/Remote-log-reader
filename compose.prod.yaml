# Use root/example as user/password credentials

services:

  db:
    image: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWD:-example}
    volumes:
      - ./installation.sql:/docker-entrypoint-initdb.d/installation.sql:ro
      - ./mysql.cnf:/etc/mysql/conf.d/mysql.cnf:ro

  flaskapp:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      FLASK_DEBUG: 0
      DATABASE_HOST: db
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - ${SSH_KEY_PATH}:/root/.ssh/id_rsa:ro
