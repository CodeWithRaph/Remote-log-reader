<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Chargement des logs</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='logs.css') }}">
</head>
<body id="loading">
  <h1>Chargement des logs…</h1>
  <div class="spinner" aria-hidden="true"></div>
  <p id="msg">Veuillez patienter...</p>

  <script>
    const statusUrl = "{{ url_for('log.status') }}";
    const resultUrl = "{{ url_for('log.result') }}";
    const msg = document.getElementById('msg');

    async function check() {
      try {
        const res = await fetch(statusUrl, { credentials: 'same-origin' });
        const data = await res.json();
        const status = (data && data.status) ? data.status : 'unknown';
        if (status === 'done') {
          window.location.href = resultUrl;
          return stop();
        }
        if (status === 'error') { msg.textContent = 'Erreur lors du traitement'; return stop(); }
        // still running: keep message
      } catch (e) {
        msg.textContent = 'Erreur réseau';
      }
    }

    let handle = setInterval(check, 1000);
    function stop(){ if (handle) clearInterval(handle); handle = null; }
    check();
  </script>
</body>
</html>
